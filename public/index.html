<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-SDLC Demo — Tasks</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: .5rem; margin: 1rem 0; }
    input[type="text"] { flex: 1; padding: .5rem; }
    button { padding: .5rem .9rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #eee; }
    li.done span { text-decoration: line-through; color: #888; }
    #error { color: #b00020; min-height: 1.2rem; }
    /* Intentional-looking empty state: muted, centered — reads as guidance, not an error. */
    #empty-state { text-align: center; color: #888; padding: 2rem 1rem; font-style: italic; }
  </style>
</head>
<body>
  <h1>Tasks</h1>

  <form id="task-form">
    <label for="title" style="position:absolute;left:-9999px;">New task</label>
    <input id="title" name="title" type="text" placeholder="New task" aria-label="New task" />
    <button type="submit">Add</button>
  </form>

  <p id="error" role="alert"></p>

  <p id="remaining" data-testid="remaining-count" aria-live="polite"></p>

  <div id="controls">
    <button type="button" id="clear-completed">Clear completed</button>
  </div>

  <ul id="tasks" aria-label="Task list"></ul>

  <!-- Shown only when there are no tasks; hidden (via [hidden]) as soon as one exists. -->
  <p id="empty-state" data-testid="empty-state" hidden>No tasks yet — add your first one above.</p>

  <script>
    const form = document.getElementById('task-form');
    const input = document.getElementById('title');
    const list = document.getElementById('tasks');
    const error = document.getElementById('error');
    const remaining = document.getElementById('remaining');
    const clearCompleted = document.getElementById('clear-completed');
    const emptyState = document.getElementById('empty-state');

    async function load() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      render(tasks);
    }

    function render(tasks) {
      // Live count of not-done tasks, above the list. Recomputed on every render,
      // so add / toggle / delete all keep it current (they each re-render via load()).
      const notDone = tasks.filter((t) => !t.done).length;
      remaining.textContent = notDone + ' remaining';

      // Show the empty-state guidance only when there are no tasks at all; hide it
      // the moment one exists. Every mutation re-renders via load(), so this stays current.
      emptyState.hidden = tasks.length > 0;

      list.innerHTML = '';
      for (const t of tasks) {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        li.dataset.testid = 'task';

        const span = document.createElement('span');
        span.textContent = t.title;

        const toggle = document.createElement('button');
        toggle.textContent = t.done ? 'Undo' : 'Done';
        toggle.setAttribute('aria-label', 'Toggle ' + t.title);
        toggle.onclick = async () => {
          await fetch('/api/tasks/' + t.id + '/toggle', { method: 'POST' });
          load();
        };

        const edit = document.createElement('button');
        edit.textContent = 'Edit';
        edit.setAttribute('aria-label', 'Edit ' + t.title);
        edit.onclick = () => startEdit(li, span, t);

        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.setAttribute('aria-label', 'Delete ' + t.title);
        del.onclick = async () => {
          await fetch('/api/tasks/' + t.id, { method: 'DELETE' });
          load();
        };

        li.append(toggle, span, edit, del);
        list.appendChild(li);
      }
    }

    // Swap a task row into an inline edit form: a text input seeded with the
    // current title plus Save / Cancel. Save commits via PATCH; an empty title
    // is rejected (the row keeps its original title and a validation message shows).
    function startEdit(li, span, t) {
      error.textContent = '';
      const editForm = document.createElement('form');
      editForm.className = 'edit-form';

      const editInput = document.createElement('input');
      editInput.type = 'text';
      editInput.value = t.title;
      editInput.setAttribute('aria-label', 'Edit title for ' + t.title);
      editInput.dataset.testid = 'edit-input';

      const save = document.createElement('button');
      save.type = 'submit';
      save.textContent = 'Save';
      save.setAttribute('aria-label', 'Save ' + t.title);

      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.textContent = 'Cancel';
      cancel.setAttribute('aria-label', 'Cancel editing ' + t.title);
      cancel.onclick = () => load();

      editForm.append(editInput, save, cancel);
      li.replaceChild(editForm, span);
      editInput.focus();

      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const title = editInput.value.trim();
        const res = await fetch('/api/tasks/' + t.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          error.textContent = body.error || 'Something went wrong';
          return;
        }
        load();
      });
    }

    clearCompleted.addEventListener('click', async () => {
      error.textContent = '';
      const res = await fetch('/api/tasks/clear-completed', { method: 'POST' });
      if (!res.ok) {
        error.textContent = 'Something went wrong';
        return;
      }
      const tasks = await res.json();
      render(tasks);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const title = input.value.trim();
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        error.textContent = body.error || 'Something went wrong';
        return;
      }
      input.value = '';
      load();
    });

    load();
  </script>
</body>
</html>
